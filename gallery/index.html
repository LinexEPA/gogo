<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>澎湖醫院 AI 教學｜沉浸式圖像畫廊</title><style>
:root{--ink:#17345f;--pink:#e85c82;--glass:rgba(255,255,255,.86);--wall:#faf8f4;--floor:#d7cec4}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#cfe2ea;color:var(--ink);touch-action:none}button{font:inherit}#app,#view{position:fixed;inset:0;overflow:hidden}#view{perspective:900px;perspective-origin:50% 48%;background:linear-gradient(#d6e9f1,#f7efe7);cursor:grab}#view.drag{cursor:grabbing}#world{position:absolute;left:50%;top:52%;width:0;height:0;transform-style:preserve-3d;will-change:transform}.plane,.art,.zone{position:absolute;transform-style:preserve-3d;backface-visibility:visible}.wall{width:4000px;height:1400px;background:linear-gradient(#fff,var(--wall));border:1px solid #ddd;box-shadow:inset 0 -30px 60px rgba(30,40,50,.05)}.side{width:3400px;height:1400px}.floor{width:4000px;height:3400px;background:repeating-linear-gradient(90deg,#d9d1c8 0 95px,#cec4b9 96px 100px);box-shadow:inset 0 0 160px rgba(70,50,35,.15)}.ceiling{width:4000px;height:3400px;background:#f7f4ed}.art{width:440px;height:300px;background:#fff;padding:14px 14px 46px;border-radius:4px;box-shadow:0 12px 30px rgba(20,30,50,.24),0 0 0 7px #eadcc8,0 0 0 10px #9e8263;cursor:pointer;backface-visibility:hidden}.pic,.thumbpic,.modalpic{background-image:url('assets/atlas.webp');background-repeat:no-repeat;background-color:#eef2f4}.pic{width:100%;height:100%;background-size:500% 500%}.cap{position:absolute;left:12px;right:12px;bottom:8px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zone{min-width:420px;padding:15px 22px;text-align:center;background:rgba(255,255,255,.95);border:2px solid #d6e2eb;border-radius:15px;box-shadow:0 8px 25px rgba(20,40,60,.14);backface-visibility:hidden}.zone b{display:block;font-size:26px}.zone span{font-size:14px;color:#6b7e90}.top{position:absolute;z-index:50;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:8px;align-items:center;pointer-events:none}.brand,.pill{pointer-events:auto;background:var(--glass);backdrop-filter:blur(12px);box-shadow:0 7px 22px rgba(20,35,55,.13);border:1px solid rgba(255,255,255,.8)}.brand{padding:9px 13px;border-radius:15px}.brand b{display:block;font-size:14px}.brand small{font-size:11px;color:#718398}.actions{margin-left:auto;display:flex;gap:7px}.pill{border-radius:13px;padding:9px 11px;font-weight:800;color:var(--ink);cursor:pointer}.cross{position:absolute;z-index:20;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none;opacity:.58}.cross:before,.cross:after{content:"";position:absolute;background:white;box-shadow:0 1px 3px #333}.cross:before{left:10px;width:2px;height:22px}.cross:after{top:10px;height:2px;width:22px}.hint{position:absolute;z-index:30;left:50%;bottom:108px;transform:translateX(-50%);background:rgba(18,38,60,.86);color:#fff;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;transition:.2s;white-space:nowrap}.hint.show{opacity:1}.controls{position:absolute;z-index:40;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:end;gap:10px;pointer-events:none}.pad{display:grid;grid-template-columns:54px 60px 54px;grid-template-rows:50px 50px;gap:6px;pointer-events:auto}.ctrl,#inspect{border:0;box-shadow:0 7px 20px rgba(15,30,48,.18);font-weight:900;cursor:pointer;touch-action:none}.ctrl{border-radius:16px;background:rgba(255,255,255,.88);color:var(--ink);font-size:23px}.ctrl:active{background:#fff0f4;color:#d44f74}.left{grid-column:1;grid-row:1/3}.fwd{grid-column:2;grid-row:1}.right{grid-column:3;grid-row:1/3}.back{grid-column:2;grid-row:2}#inspect{pointer-events:auto;border-radius:17px;background:var(--ink);color:white;padding:16px 18px;font-size:14px}.drawer{position:absolute;z-index:80;right:0;top:0;bottom:0;width:min(430px,92vw);background:rgba(250,250,248,.97);backdrop-filter:blur(16px);box-shadow:-15px 0 42px rgba(20,35,55,.2);transform:translateX(105%);transition:.27s;padding:18px;overflow:auto;touch-action:pan-y}.drawer.open{transform:none}.dh{position:sticky;top:-18px;z-index:2;background:rgba(250,250,248,.96);padding:12px 0;display:flex;align-items:center;justify-content:space-between}.dh h2{font-size:18px;margin:0}.close{border:0;background:#eaf0f4;color:var(--ink);padding:8px 10px;border-radius:11px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.thumb{border:0;background:white;padding:7px;border-radius:13px;box-shadow:0 4px 14px rgba(20,35,55,.1);text-align:left;color:var(--ink)}.thumbpic{aspect-ratio:16/9;background-size:500% 500%;border-radius:9px}.thumb b{display:block;font-size:11px;line-height:1.35;margin:6px 3px 2px}.thumb span{font-size:9px;color:#7a8999;margin:0 3px;display:block}.modal{position:absolute;z-index:100;inset:0;background:rgba(7,17,30,.84);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:22px;touch-action:pan-y}.modal.open{display:flex}.card{width:min(1050px,96vw);max-height:92vh;background:white;border-radius:21px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 290px;box-shadow:0 28px 80px #0007}.modalpic{width:100%;aspect-ratio:16/9;align-self:center;background-size:500% 500%;background-color:#111}.info{padding:21px;display:flex;flex-direction:column;gap:11px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--pink);font-weight:900}.info h2{font-size:22px;line-height:1.3;margin:0}.info p{font-size:13px;line-height:1.7;color:#6b7d90;margin:0}.nav{margin-top:auto;display:flex;gap:7px;flex-wrap:wrap}.nav button{border:0;border-radius:11px;padding:9px 11px;font-weight:800;color:var(--ink);background:#edf2f6}.nav .primary{background:var(--ink);color:white}.intro{position:absolute;z-index:120;inset:0;background:linear-gradient(135deg,#edf7faee,#fff0f4f2);display:flex;align-items:center;justify-content:center;padding:22px}.introbox{width:min(680px,94vw);background:#fffffff0;border-radius:27px;padding:30px;text-align:center;box-shadow:0 25px 70px rgba(40,60,80,.18)}.introbox .tag{display:inline-block;background:#edf5fa;padding:6px 11px;border-radius:999px;font-size:11px;font-weight:900}.introbox h1{font-size:clamp(27px,5vw,44px);margin:12px 0 7px}.introbox p{font-size:14px;line-height:1.8;color:#667b91;max-width:540px;margin:0 auto}.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.tip{background:#f6f8fa;border-radius:14px;padding:11px;font-size:12px}.tip b{display:block;font-size:20px;margin-bottom:4px}.enter{border:0;background:var(--ink);color:white;font-weight:900;font-size:16px;border-radius:15px;padding:13px 23px;box-shadow:0 9px 25px rgba(23,52,95,.25)}@media(max-width:760px){#view{perspective:760px}.brand small{display:none}.pill{padding:8px 9px;font-size:12px}.card{grid-template-columns:1fr;overflow:auto}.info{padding:16px}.info h2{font-size:19px}.modalpic{min-height:220px}.tips{grid-template-columns:1fr}.tip{padding:9px}.introbox{padding:22px 16px}.pad{grid-template-columns:48px 54px 48px;grid-template-rows:46px 46px}.controls{gap:7px}#inspect{padding:14px 13px}.hint{bottom:102px}}</style></head><body><div id="app"><div id="view"><div id="world"></div></div><div class="cross"></div><div class="top"><div class="brand"><b>澎湖醫院 AI 教學圖像畫廊</b><small>前進、轉彎，走近作品逐張審視</small></div><div class="actions"><button class="pill" id="home">↩ 入口</button><button class="pill" id="list">☰ 作品</button></div></div><div class="hint" id="hint">靠近作品後，可按「審視作品」</div><div class="controls"><div class="pad"><button class="ctrl left" data-a="left">↶</button><button class="ctrl fwd" data-a="fwd">▲</button><button class="ctrl right" data-a="right">↷</button><button class="ctrl back" data-a="back">▼</button></div><button id="inspect">🔎 審視作品</button></div><aside class="drawer" id="drawer"><div class="dh"><h2>作品導覽｜22 張</h2><button class="close" id="closeD">關閉</button></div><div class="grid" id="grid"></div></aside><div class="modal" id="modal"><div class="card"><div class="modalpic" id="modalpic"></div><div class="info"><div class="eyebrow" id="mzone"></div><h2 id="mtitle"></h2><p id="mdesc"></p><div class="nav"><button id="prev">← 上一張</button><button id="next">下一張 →</button><button class="primary" id="closeM">回到畫廊</button></div></div></div></div><div class="intro" id="intro"><div class="introbox"><span class="tag">PENGHU HOSPITAL × AI TEACHING</span><h1>走進我們的教案思考</h1><p>把這段時間為澎湖醫院課程生成的圖像，放進一個可以前進、轉身與停下來觀看的虛擬展場。</p><div class="tips"><div class="tip"><b>▲ ▼</b>前進／後退</div><div class="tip"><b>↶ ↷</b>左右轉身</div><div class="tip"><b>🔎</b>靠近後放大審視</div></div><button class="enter" id="enter">進入畫廊</button></div></div></div><script>const A='assets/atlas.webp';const titles=['工具很多，卻不知道怎麼開始','工具不用多，也能做出成果','四種觀看設計','不要急著叫 AI 給答案','AI 護理教育創作流程','圖片＝瞬間，影片＝變化','圖片：定格這一刻','影片：呈現下一秒','被迫選到導尿題目的崩潰時刻','傳統導尿課堂的無聊感','從繁瑣步驟到吸睛教學','導尿照護步驟與完成檢核','Notebook 學習內容生成流程','一份資料，多種可能','AI 筆記本：多元學習新可能','護理多元學習工具包','從混亂到清晰的護理教學藍圖','從混亂筆記到明亮護理教學','從困惑學習到自信教學','活力護理師的學習探險','護理創意工作流程','AI 醫療教學四大重點'];const desc=['開場用對比指出：工具很多，不代表知道如何開始。','全日核心主張：工具不必多，重點是能真的產出成果。','用比較、聚焦、節奏、情境，重新思考內容如何被看見。','先把模糊想法說清楚，再讓 AI 進入協作。','從想法、引導網頁、GPT 對話到概念圖與 NotebookLM 的工作流。','建立最基本的生成觀念：圖片描述這一刻，影片描述下一秒。','圖片提示詞聚焦單一瞬間、構圖與視覺語言。','影片提示詞加入動作、鏡頭、節奏與時間變化。','導尿案例的真實起點：不是題目不好，而是需要找到新的觀看入口。','內容重要，不等於學員願意停下來看。','從傳統步驟教學，重新設計成有節奏、有鉤子的觀看體驗。','最後仍要回到真正要學會與記住的臨床重點。','以同一份可信來源為中心，向外長成不同學習產物。','同一份資料可以轉成簡報、圖表、影片、Quiz、學習卡等。','把 NotebookLM 看成內容重組與學習轉譯的工作台。','用聽、看、記、辨認、應用等不同方式接近同一份知識。','從散亂素材中整理出一條可教、可理解的內容主線。','原始筆記與資料經整理後，長成可使用的教材。','整日收束：從不知道怎麼開始，到有能力把想法做出來。','作為課程探索感與 AI 協作氛圍的串場視覺。','把創意形成、AI 協作與工具串接放在同一條路徑中。','把醫療教學的重點重新收斂成可觀看、可理解、可行動的內容。'];const zone=i=>i<6?'A｜從想法開始':i<12?'B｜把內容變得值得看':'C｜NotebookLM：一份資料，多種可能';function bg(el,i){let c=i%5,r=Math.floor(i/5);el.style.backgroundImage=`url(${A})`;el.style.backgroundPosition=`${c*25}% ${r*25}%`}const world=document.getElementById('world'),arts=[];function wall(cls,x,y,z,ry){let e=document.createElement('div');e.className='plane wall '+cls;e.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg) translate(-50%,-50%)`;world.appendChild(e)}wall('',0,-350,-1700,0);wall('',0,-350,1700,180);wall('side',-2000,-350,0,90);wall('side',2000,-350,0,-90);let f=document.createElement('div');f.className='plane floor';f.style.transform='translate3d(0,350px,0) rotateX(90deg) translate(-50%,-50%)';world.appendChild(f);let ce=document.createElement('div');ce.className='plane ceiling';ce.style.transform='translate3d(0,-1050px,0) rotateX(90deg) translate(-50%,-50%)';world.appendChild(ce);const placements=[];[-1500,-900,-300,300,900,1500].forEach((x,j)=>placements.push({x,z:-1685,ry:0,n:[0,1,2,3,4,5][j]}));[-1250,-625,0,625,1250].forEach((z,j)=>placements.push({x:1985,z,ry:-90,n:[6,7,8,9,10][j]}));[1500,900,300,-300,-900,-1500].forEach((x,j)=>placements.push({x,z:1685,ry:180,n:[11,12,13,14,15,16][j]}));[1250,625,0,-625,-1250].forEach((z,j)=>placements.push({x:-1985,z,ry:90,n:[17,18,19,20,21][j]}));placements.forEach(p=>{let e=document.createElement('div');e.className='art';e.style.transform=`translate3d(${p.x}px,-360px,${p.z}px) rotateY(${p.ry}deg) translate(-50%,-50%)`;e.innerHTML='<div class="pic"></div><div class="cap"></div>';bg(e.querySelector('.pic'),p.n);e.querySelector('.cap').textContent=titles[p.n];e.onclick=()=>openModal(p.n);world.appendChild(e);arts[p.n]={...p,el:e}});function addZone(text,x,z,ry){let e=document.createElement('div');e.className='zone';e.innerHTML=`<b>${text.split('｜')[0]}</b><span>${text.split('｜')[1]}</span>`;e.style.transform=`translate3d(${x}px,-760px,${z}px) rotateY(${ry}deg) translate(-50%,-50%)`;world.appendChild(e)}addZone('A｜從想法開始',0,-1680,0);addZone('B｜把內容變得值得看',1980,0,-90);addZone('C｜一份資料，多種可能',0,1680,180);let cam={x:0,z:900,yaw:0},keys={},drag=false,lastX=0,cur=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function render(){world.style.transform=`rotateY(${-cam.yaw}deg) translate3d(${-cam.x}px,0,${-cam.z}px)`;let n=nearest();document.getElementById('hint').classList.toggle('show',!!n)}function rad(){return cam.yaw*Math.PI/180}function nearest(){let best=null,bd=1e9;arts.forEach((a,i)=>{if(!a)return;let dx=a.x-cam.x,dz=a.z-cam.z,d=Math.hypot(dx,dz);let angle=Math.atan2(dx,-dz)*180/Math.PI;let diff=Math.abs((((angle-cam.yaw)+540)%360)-180);if(d<720&&diff<48&&d<bd){best=i;bd=d}});return best}function step(){let speed=keys.fwd?18:keys.back?-15:0;if(keys.left)cam.yaw-=1.8;if(keys.right)cam.yaw+=1.8;if(speed){cam.x+=Math.sin(rad())*speed;cam.z-=Math.cos(rad())*speed;cam.x=clamp(cam.x,-1550,1550);cam.z=clamp(cam.z,-1250,1250)}render();requestAnimationFrame(step)}step();document.querySelectorAll('[data-a]').forEach(b=>{let a=b.dataset.a;['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[a]=1}));['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[a]=0}))});addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.fwd=1;if(['ArrowDown','s','S'].includes(e.key))keys.back=1;if(['ArrowLeft','a','A'].includes(e.key))keys.left=1;if(['ArrowRight','d','D'].includes(e.key))keys.right=1});addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.fwd=0;if(['ArrowDown','s','S'].includes(e.key))keys.back=0;if(['ArrowLeft','a','A'].includes(e.key))keys.left=0;if(['ArrowRight','d','D'].includes(e.key))keys.right=0});const view=document.getElementById('view');view.onpointerdown=e=>{drag=true;lastX=e.clientX;view.setPointerCapture(e.pointerId);view.classList.add('drag')};view.onpointermove=e=>{if(drag){cam.yaw+=(e.clientX-lastX)*.22;lastX=e.clientX}};view.onpointerup=()=>{drag=false;view.classList.remove('drag')};function openModal(i){cur=(i+22)%22;let p=document.getElementById('modalpic');bg(p,cur);document.getElementById('mzone').textContent=zone(cur);document.getElementById('mtitle').textContent=titles[cur];document.getElementById('mdesc').textContent=desc[cur];document.getElementById('modal').classList.add('open')}document.getElementById('inspect').onclick=()=>{let n=nearest();if(n!==null)openModal(n)};document.getElementById('closeM').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('prev').onclick=()=>openModal(cur-1);document.getElementById('next').onclick=()=>openModal(cur+1);document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};const grid=document.getElementById('grid');for(let i=0;i<22;i++){let b=document.createElement('button');b.className='thumb';b.innerHTML='<div class="thumbpic"></div><b></b><span></span>';bg(b.querySelector('.thumbpic'),i);b.querySelector('b').textContent=titles[i];b.querySelector('span').textContent=zone(i);b.onclick=()=>{jump(i);document.getElementById('drawer').classList.remove('open')};grid.appendChild(b)}document.getElementById('list').onclick=()=>document.getElementById('drawer').classList.add('open');document.getElementById('closeD').onclick=()=>document.getElementById('drawer').classList.remove('open');function jump(i){let a=arts[i],off=620,rr=a.ry*Math.PI/180;cam.x=a.x+Math.sin(rr)*off;cam.z=a.z+Math.cos(rr)*off;cam.yaw=(-a.ry+360)%360;render()}function home(){cam={x:0,z:900,yaw:0};render()}document.getElementById('home').onclick=home;document.getElementById('enter').onclick=()=>document.getElementById('intro').style.display='none';</script></body></html>
